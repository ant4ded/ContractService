databaseChangeLog:
  - changeSet:
      id: create-user-003
      author: adzedint
      changes:
        - createTable:
            tableName: user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user
            columnNames: id
            constraintName: user_pk
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: insert-initial-user-003
      author: adzedzik
      changes:
        - insert:
            tableName: user
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: username
                  value: 'admin'
              - column:
                  name: password
                  value: '$2a$10$k0EizThdrOnJRj9db.gRgenmRCf05Xz9Ix9YUnPfbtq3PUD0debvS'
        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: role
                  value: 'ADMIN'